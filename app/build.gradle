plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Upload key for Google Play. keystore.properties is intentionally not committed;
// without it release builds are produced unsigned (debug builds still work).
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'com.edens.marblemaster'
    compileSdk 36

    defaultConfig {
        applicationId "com.edens.marblemaster"
        minSdk 24
        // Play requires new apps to target Android 16 (API 36) from 31 Aug 2026.
        targetSdk 36
        versionCode 3
        versionName "1.1"
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : null
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.1.0'
}
